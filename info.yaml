# Tiny Tapeout project information
project:
  title:        "CWRUPIO"      # Project title
  author:       "ASICWRU"      # Your name
  discord:      "joopyyy"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable serial-protocol engine: protocols are programs, pins are reconfigurable"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Clock frequency in Hz (matches CLOCK_PERIOD 20 ns in src/config.json)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_asicwru_cwrupio"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "cwrupio_pkg.sv"
    - "instruction_memory.sv"
    - "program_counter.sv"
    - "instruction_decoder.sv"
    - "sequencer.sv"
    - "timing_unit.sv"
    - "loop_counter.sv"
    - "tx_shift_reg.sv"
    - "rx_shift_reg.sv"
    - "host_interface.sv"
    - "pin_control.sv"
    - "cwrupio_top.sv"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HOST_SCK"
  ui[1]: "HOST_CS_N"
  ui[2]: "HOST_MOSI"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "HOST_MISO"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "P0"
  uio[1]: "P1"
  uio[2]: "P2"
  uio[3]: "P3"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
